
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohana - Simple yet Detailed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="#" class="logo">
    <img src="images/OhanaLogo.png" alt="Ohana Family Tree">
</a>
        <span class="headerCaption">Simplicity..  Creativity...</span>
    </header>

    <main class="details">

        <section class="hero">
            
            <h1>Lets write<br>your story on the tree</h1>
        </section>

        <section class="options">

            <button class="option-card create-card"
                    onclick="openLogin('create')">
                <div class="card-top">
                    <div class="card-icon create-icon">&#43;</div>
                </div>

                <div class="card-content">
                    <span class="card-label">BUILD YOUR OHANA</span>
                    <h2>Create a New Tree</h2>
                </div>

                <div class="card-footer">
                    <span>Begin here</span>
                    <span>→</span>
                </div>
            </button>

            <button class="option-card open-card"
                    onclick="openLogin('open')">
                <div class="card-top">
                    <div class="card-icon open-icon">⌂</div>
                </div>

                <div class="card-content">
                    <span class="card-label">WELCOME BACK</span>
                    <h2>Open an Existing Tree</h2>
                </div>

                <div class="card-footer">
                    <span>Continue building your tree</span>
                    <span>→</span>
                </div>
            </button>

        </section>

    </main>


    <!-- Login box-->
    <div class="modal-overlay" id="loginModal"
         onclick="closeLoginOutside(event)" hidden>

        <div class="login-modal" role="dialog"
             aria-modal="true" aria-labelledby="modalTitle">

            <button class="close-button" onclick="closeLogin()"
                    aria-label="Close login dialog">×</button>


            <p class="modal-eyebrow">WELCOME TO OHANA</p>

            <h2 id="modalTitle">You can start here.</h2>

            <p id="modalDescription">
                Sign in to continue.
            </p>

            <button class="oauth-button" onclick="oauthPlaceholder()">
                <span class="google-icon"></span>
                Continue with Google
            </button>

            <button class="oauth-button secondary-oauth"
                    onclick="oauthPlaceholder()">
                Continue with another account
            </button>

            <p class="modal-terms">
                Authentication required.
            </p>

        </div>
    </div>

    <script src="LoginScript.js"></script>
</body>
</html>
