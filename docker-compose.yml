# docker-compose.yml
services:
  ohana-app:
    image: ghcr.io/pixel8edm8/ohana:latest
    build:
      context: .
    ports:
      - "8080:80" 
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
  
  ohana-dev:
    image: ghcr.io/pixel8edm8/ohana:dev
    build:
      context: .
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    restart: unless-stopped
  