# Plain HTTP on 80 and 8080 redirects to HTTPS on 443 — but only for
# direct hits. Requests arriving via Moxie's HTTPS proxy carry
# X-Forwarded-Proto: https (set in apache-proxy.conf) and are served
# normally instead, so this can't loop behind the proxy.
server {
    listen 80;
    listen 8080;
    server_name _;

    if ($http_x_forwarded_proto != 'https') {
        return 301 https://$host$request_uri;
    }

    server_tokens off;

    location ~/\. {
        deny all;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

# Serves the site on 443. Moxie terminates TLS with its own
# certificate, so there is deliberately no `ssl` here — the traffic
# arriving at this port is already decrypted. HSTS tells browsers to
# always use HTTPS for this host from now on.
server {
    listen 443;
    server_name localhost;

    server_tokens off;  # don't advertise the nginx version

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never serve hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
