server {
    listen 80;
    listen 8080;
    server_name _;

    if ($http_x_forwarded_proto != 'https') {
        return 301 https://$host$request_uri;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

# Serves the site on 443. Moxie terminates TLS with its own
# certificate, so there is deliberately no `ssl` here — the traffic
# arriving at this port is already decrypted. HSTS tells browsers to
# always use HTTPS for this host from now on.
server {
    listen 443;
    server_name localhost;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # This line is critical for SPAs: if a file isn't found, serve index.html
        try_files $uri $uri/ /index.html;
    }
}